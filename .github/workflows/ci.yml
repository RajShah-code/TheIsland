# Builds the app and tests the hook relay on every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Compiles the helper and relay exes with Windows' own csc.exe, then the Electron app.
      - run: npm run build
      - run: npm test
